[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Pinned to an exact rev, NOT branch = "dev".
#
# branch = "dev" means any `cargo update` silently moves you onto whatever that
# day brought. A rev makes an update a deliberate act with a diff you can read.
#
# default-features = false does NOT drop the X11 backend: gpui_ce_platform
# declares `gpui_linux` without default-features = false, and gpui_linux's
# default is ["wayland", "x11"]. Cargo features are additive and cannot be
# subtracted, so x11rb / zed-xim / x11-clipboard are in the tree regardless.
# Verified with `cargo tree -i x11rb`. Cost is binary size only — unused code
# costs disk, not RAM. Dropping it requires patching the fork; see DECISIONS.md.
gpui = { package = "gpui-ce", git = "https://github.com/moiCR/gpui-capsule", rev = "c04b526d8a49ee34c7667848669ae3e55338f5ed", default-features = false, features = ["wayland"] }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/moiCR/gpui-capsule", rev = "c04b526d8a49ee34c7667848669ae3e55338f5ed", default-features = false, features = ["wayland"] }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
arc-swap = "1.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
rust-embed = "8"

# Used only to make wallpaper thumbnails. `gpui::img(path)` decodes at source
# resolution with no downscale, so 29 wallpapers at 4K would be ~957 MB of
# RGBA8. Same version gpui already resolves, so it is not a second copy in the
# build graph.
image = "0.25"

# Already in the graph via zbus, so this costs no new build. Used for the bar
# clock, which must show local time including DST - reading /etc/localtime is
# a compiled TZif blob and reimplementing the rules is not the job.
chrono = "0.4"

# Fuzzy matching for the launcher, by the skim author. Scored subsequence
# matching, so results order the way muscle memory expects rather than by
# something invented here. nucleo (the wrapper with a parallel matcher) would
# be the alternative; the launcher is a few hundred candidates, not a file
# index, so the simpler matcher is the right size.
nucleo-matcher = "0.3"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true

# NOTE: no `panic = "abort"`. It would shrink the binary slightly, but it turns
# every panic in every thread into a full process abort. A shell that dies
# because the tray helper thread panicked is worse than one that logs and
# carries on, and unwind leaves the IPC socket and layer surfaces to clean up.